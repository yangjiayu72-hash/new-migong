<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Floating Multi-Level Maze</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="info">
        <h1>3D Floating Maze</h1>
        <p>Drag mouse to tilt the maze and guide the ball through each level</p>
        <p>Ball must fall through the center hole on each level</p>
        <div id="level-indicator">Level: <span id="current-level">1</span> / <span id="total-levels">5</span></div>
    </div>

    <div id="container"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module" src="main.js"></script>
</body>
</html>
