<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Floating Multi-Level Maze</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="info">
        <h1>3D Floating Maze</h1>
        <p>Drag mouse to tilt the maze and guide all balls through each level</p>
        <p>6 balls start at the top - each must fall through the center hole</p>
        <p>Balls can interact and collide with each other!</p>
    </div>

    <div id="container"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module" src="main.js"></script>
</body>
</html>
